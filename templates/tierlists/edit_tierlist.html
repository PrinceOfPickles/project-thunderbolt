{% extends 'base.html' %}
{% block title %}Edit Tier List{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title text-center">Edit Tier List</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">Update Tier List</button>
                </form>
                <div class="mt-3 text-center">
                    <a href="{% url 'add_drinks_to_tierlist' tierlist.id %}" class="btn btn-info w-100">Add Drinks</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
