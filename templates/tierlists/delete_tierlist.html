{% extends 'base.html' %}
{% block title %}Delete Tier List{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title text-center">Delete Tier List</h2>
                <p>Are you sure you want to delete your tier list "{{ tierlist.title }}"?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger w-100">Delete Tier List</button>
                </form>
                <a href="{% url 'tierlist_detail' tierlist.id %}" class="btn btn-secondary w-100 mt-2">Cancel</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
